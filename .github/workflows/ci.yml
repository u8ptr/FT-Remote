name: build

on:
  push:
  pull_request:

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
          modules: 'qtmultimedia qtwebsockets'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Configure
        run: cmake -S . -B build -DFTREMOTE_BUILD_TESTS=ON -DFTREMOTE_FETCH_QTKEYCHAIN=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage Windows QtKeychain runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'build\Release\qt6keychain.dll'
          $destination = Join-Path $env:QT_ROOT_DIR 'bin\qt6keychain.dll'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "QtKeychain runtime not found at $source"
          }
          Copy-Item -LiteralPath $source -Destination $destination
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Verify macOS bundle dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/ftremote-install"
          cmake --install build --prefix "$install_root" --config Release
          app="$install_root/ftremote.app"
          keychain="$app/Contents/Frameworks/libqt6keychain.1.dylib"
          qml_module="$app/Contents/Resources/qml/QtQuick/qmldir"
          test -f "$keychain"
          test -f "$qml_module"
          otool -L "$app/Contents/MacOS/ftremote" | grep -Fq '@rpath/libqt6keychain.1.dylib'
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/AppDir/usr" --config Release
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp packaging/ftremote.desktop AppDir/usr/share/applications/ftremote.desktop
          cp packaging/ftremote.svg AppDir/usr/share/icons/hicolor/scalable/apps/ftremote.svg
          curl -L --fail --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/AppDir/usr/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy.AppImage --appdir AppDir --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: ft-remote-${{ matrix.os }}
          path: |
            *.exe
            *.zip
            *.dmg
            *.tar.gz
            *.AppImage
          if-no-files-found: error
